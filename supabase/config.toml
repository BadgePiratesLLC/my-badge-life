# Platform-level JWT check: the Authorization header must contain a validly
# signed JWT (this already rejects malformed/missing tokens). It does NOT by
# itself reject the anon key, since the anon key is itself a validly signed
# JWT — that extra check is done inside supabase/functions/send-email/index.ts.
[functions.send-email]
verify_jwt = true

[functions.process-badge-embeddings]
verify_jwt = false

[functions.analyze-badge-image]
verify_jwt = false


[functions.match-badge-image]
verify_jwt = false

[functions.test-replicate]
verify_jwt = false
